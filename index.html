<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f1e8">
    <meta name="description" content="A fast, simple feet to meters converter.">
    <title>Feet to meters</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="app-shell">
        <header class="topbar">
            <a class="brand" href="./" aria-label="Feet to meters home">
                <span class="brand-mark" aria-hidden="true">↗</span>
                <span>Unit / 01</span>
            </a>
            <button class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
                <span class="theme-icon" aria-hidden="true">☼</span>
                <span class="theme-label">Light</span>
            </button>
        </header>

        <section class="hero" aria-labelledby="page-title">
            <p class="eyebrow">Length converter</p>
            <h1 id="page-title">Feet <span>into</span> meters.</h1>
            <p class="intro">A clear conversion for the distance in front of you.</p>
        </section>

        <section class="converter-panel" aria-label="Feet to meters converter">
            <div class="result-block">
                <div class="result-label"><span class="dot"></span>Converted distance</div>
                <output class="result-value" id="meter-output" for="feet-slider">0.00 <small>m</small></output>
                <p class="formula" id="formula">0 ft × 0.3048</p>
            </div>

            <div class="control-block">
                <div class="control-heading">
                    <label for="feet-slider">Choose feet</label>
                    <output id="feet-output" for="feet-slider">0 ft</output>
                </div>
                <div class="slider-wrap">
                    <input id="feet-slider" type="range" min="0" max="800" step="5" value="0"
                        aria-label="Distance in feet">
                    <div class="scale" aria-hidden="true">
                        <span>0</span><span>200</span><span>400</span><span>600</span><span>800 ft</span>
                    </div>
                </div>
            </div>
        </section>

        <footer class="footer-note">
            <span>1 foot = 0.3048 meters</span>
            <span class="status"><span class="status-light"></span>Ready to convert</span>
        </footer>
    </main>
    <script src="app.js"></script>
</body>

</html>
